<!-- ═══════════════════════════════════════════════════════════
     FIX 2: MATERI baca GitHub folder (diadaptasi dari index(2).html)
     Ganti sumber explorer dari data/materi.json → GitHub API
     ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Konfigurasi repo — sesuaikan jika berbeda */
const GH = {
  owner: 'vickysegu',
  repo:  'vickysegu.github.io',
  base:  'Materi',   // folder root yang dibaca
  cacheTTL: 5 * 60 * 1000
};

/* Icon berdasarkan ekstensi */
function fileIcon(name, isDir){
  if(isDir) return '📁';
  const ext = (name.split('.').pop()||'').toLowerCase();
  if(/^(png|jpg|jpeg|gif|webp|svg|bmp|avif|ico)$/.test(ext)) return '🖼️';
  if(/^(mp4|webm|ogv|mov|m4v)$/.test(ext))                     return '🎬';
  if(/^(mp3|wav|ogg|m4a|aac|flac)$/.test(ext))                 return '🎵';
  if(ext === 'pdf')                                            return '📕';
  if(/^(docx?|odt|rtf)$/.test(ext))                            return '📘';
  if(/^(xlsx?|ods|csv)$/.test(ext))                            return '📗';
  if(/^(pptx?|odp)$/.test(ext))                                return '📙';
  if(/^(html?|htm)$/.test(ext))                                return '🌐';
  if(/^(zip|rar|7z|tar|gz)$/.test(ext))                        return '🗜️';
  if(/^(txt|md|json|xml|log|yml|yaml)$/.test(ext))             return '📝';
  if(/^(js|ts|py|java|c|cpp|h|css|php|rb|go|sql|sh)$/.test(ext)) return '📄';
  return '📎';
}
function fmtSize(b){
  if(!b) return '';
  if(b<1024) return b+' B';
  if(b<1048576) return Math.round(b/1024)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

/* State */
const state = {
  stack: [GH.base],     // path stack untuk Back/Up
  current: GH.base,
  items: [],
  view: 'icons',
  loading: false
};

/* Cache helpers */
function cacheKey(path){ return 'xp_gh_'+path; }
function getCache(path){
  try{
    const raw = sessionStorage.getItem(cacheKey(path));
    if(!raw) return null;
    const obj = JSON.parse(raw);
    if(Date.now() - obj.t > GH.cacheTTL) return null;
    return obj.d;
  }catch(e){ return null; }
}
function setCache(path, data){
  try{ sessionStorage.setItem(cacheKey(path), JSON.stringify({t:Date.now(), d:data})); }catch(e){}
}

/* Fetch 1 folder dari GitHub Contents API */
async function fetchGitHubFolder(path, force){
  if(!force){
    const c = getCache(path);
    if(c) return c;
  }
  const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${path}`;
  const r = await fetch(url, {headers:{'Accept':'application/vnd.github.v3+json'}});
  if(!r.ok) {
    let msg = `HTTP ${r.status}`;
    if(r.status === 404) msg = `Folder "${path}" tidak ditemukan di repo ${GH.owner}/${GH.repo}`;
    if(r.status === 403) msg = 'Rate limit GitHub tercapai. Coba lagi dalam ~1 jam atau pakai token.';
    throw new Error(msg);
  }
  const files = await r.json();
  if(!Array.isArray(files)) throw new Error('Response GitHub bukan array');
  setCache(path, files);
  return files;
}

/* Render file/folder ke tampilan Explorer XP */
function renderItems(items){
  const filesEl = document.getElementById('expFiles');
  const crumb   = document.getElementById('expCrumb');
  const status  = document.getElementById('expStatus');
  const title   = document.getElementById('expTitle');
  const treeEl  = document.getElementById('expTreeItems');
  if(!filesEl) return;

  filesEl.className = 'exp-files' + (state.view==='list' ? ' list-view' : '');

  if(!items.length){
    filesEl.innerHTML = '<div style="grid-column:1/-1;padding:24px;color:#666;text-align:center;">Folder ini kosong.</div>';
  } else {
    filesEl.innerHTML = items.map((f,i)=>{
      const isDir = f.type === 'dir';
      const ext = !isDir ? (f.name.split('.').pop()||'').toLowerCase() : '';
      const meta = isDir ? 'Folder' : (fmtSize(f.size) + (ext ? ' · '+ext.toUpperCase() : ''));
      return `<div class="exp-file" data-i="${i}">
        <div class="exp-file-icon">${fileIcon(f.name, isDir)}</div>
        <div class="exp-file-name">${esc(f.name)}</div>
        <div class="exp-file-meta">${meta}</div>
      </div>`;
    }).join('');

    filesEl.querySelectorAll('.exp-file').forEach((el,idx)=>{
      const f = items[idx];
      const isDir = f.type === 'dir';
      const webUrl = `https://${GH.owner}.github.io/${f.path}`;

      el.onclick = () => {
        filesEl.querySelectorAll('.exp-file').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        try{ Sound.click(); }catch(e){}
      };
      el.ondblclick = () => {
        if(isDir) navigate(f.path);
        else window.open(webUrl, '_blank', 'noopener');
      };
      el.oncontextmenu = e => {
        e.preventDefault();
        const menu = [
          {label: isDir?'Buka':'Buka di Tab Baru', ico:'📂', handler: ()=>{
            if(isDir) navigate(f.path);
            else window.open(webUrl, '_blank', 'noopener');
          }}
        ];
        if(!isDir){
          menu.push(
            {label:'Download', ico:'⬇️', handler: ()=>{
              const a = document.createElement('a');
              a.href = f.download_url; a.download = f.name; a.click();
            }},
            {label:'Copy URL', ico:'📋', handler: ()=>{
              navigator.clipboard?.writeText(webUrl);
            }}
          );
        }
        menu.push('---');
        menu.push({label:'Properties', ico:'⚙️', handler: ()=>{
          try{ showDialog(f.name, isDir?'📁':'📄',
            `Tipe: ${isDir?'Folder':'File'}<br>` +
            `Path: <code>${esc(f.path)}</code><br>` +
            (isDir ? '' : `Ukuran: ${fmtSize(f.size)}<br>`) +
            `Repo: ${GH.owner}/${GH.repo}`, null); }catch(e){}
        }});
        try{ showContextMenu(e.clientX, e.clientY, menu); }catch(e){}
      };
    });
  }

  /* Breadcrumb */
  if(crumb){
    const parts = state.current.split('/');
    crumb.innerHTML = parts.map((p,i)=>{
      const isLast = i === parts.length-1;
      const path = parts.slice(0,i+1).join('/');
      return `<span class="exp-crumb${isLast?' current':''}" data-path="${esc(path)}" style="${isLast?'':'cursor:pointer;color:#2f6fed;'}">${i===0?'📁 ':'📂 '}${esc(p)}</span>`;
    }).join('<span class="exp-sep-b">▸</span>');
    crumb.querySelectorAll('.exp-crumb').forEach(c=>{
      c.onclick = () => {
        if(c.classList.contains('current')) return;
        navigate(c.dataset.path, true);
      };
    });
  }

  /* Sidebar tree */
  if(treeEl){
    treeEl.querySelectorAll('.exp-tree-item').forEach(x=>x.remove());
    const dirs = items.filter(f=>f.type==='dir');
    if(!dirs.length){
      const e = document.createElement('div');
      e.style.cssText = 'padding:10px;color:#8892a3;font-size:11px;';
      e.textContent = 'Tidak ada subfolder';
      treeEl.appendChild(e);
    } else {
      dirs.forEach(d=>{
        const el = document.createElement('div');
        el.className = 'exp-tree-item';
        el.innerHTML = `<span class="ic">📁</span><span>${esc(d.name)}</span>`;
        el.onclick = () => navigate(d.path);
        treeEl.appendChild(el);
      });
    }
  }

  if(status) status.textContent = items.length + ' objects';
  if(title){
    const last = state.current.split('/').pop();
    title.textContent = last || 'Materi';
  }
  const toggleText = document.querySelector('#expTreeToggle .t-text');
  if(toggleText){
    const last = state.current.split('/').pop();
    if(toggleText) toggleText.textContent = last || 'Materi';
  }
}

/* Navigate ke path baru */
async function navigate(path, replace){
  if(state.loading) return;
  state.loading = true;
  if(!replace) state.stack.push(state.current);
  state.current = path;

  const filesEl = document.getElementById('expFiles');
  const status  = document.getElementById('expStatus');
  if(filesEl){
    filesEl.innerHTML = `<div style="grid-column:1/-1;padding:24px;color:#666;display:flex;gap:10px;align-items:center;">
      <div style="width:16px;height:16px;border:2px solid #ccc;border-top-color:#3d7ad4;border-radius:50%;animation:iespin .8s linear infinite;"></div>
      Memuat dari GitHub…</div>`;
  }
  if(status) status.textContent = 'Loading…';

  try{
    const items = await fetchGitHubFolder(path);
    state.items = items;
    renderItems(items);
  }catch(err){
    console.error('[Materi]', err);
    if(filesEl){
      filesEl.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;">
        <div style="font-size:40px;margin-bottom:10px;">⚠️</div>
        <div style="font-weight:700;color:#c33;">Gagal memuat folder</div>
        <div style="font-size:11.5px;color:#666;margin-top:8px;">${esc(err.message)}</div>
        <button id="materiRetry" style="margin-top:14px;padding:6px 16px;background:linear-gradient(180deg,#3d7ad4,#1e56c8);color:#fff;border:none;border-radius:3px;cursor:pointer;font-weight:600;">🔄 Coba Lagi</button>
      </div>`;
      document.getElementById('materiRetry')?.addEventListener('click', ()=>{
        sessionStorage.removeItem(cacheKey(path));
        navigate(path, true);
      });
    }
    if(status) status.textContent = 'Error';
  }finally{
    state.loading = false;
  }
}

/* Override renderExplorer global (dipanggil saat init & refresh) */
window.renderExplorer = function(){
  if(!state.items.length) return navigate(GH.base, true);
  renderItems(state.items);
};

/* Hook: panggil explorer pertama kali saat user buka app atau klik desktop */
const _openApp = window.openApp;
let _opened = false;
window.openApp = function(id){
  const r = _openApp.apply(this, arguments);
  if(id === 'explorer' && !_opened){
    _opened = true;
    setTimeout(()=>navigate(GH.base, true), 50);
  } else if(id === 'explorer'){
    setTimeout(()=>renderItems(state.items), 30);
  }
  return r;
};

/* Re-bind tombol toolbar dengan versi GitHub-aware */
function rebind(id, handler){
  const el = document.getElementById(id);
  if(!el) return;
  const c = el.cloneNode(true);
  el.parentNode.replaceChild(c, el);
  c.onclick = handler;
}
rebind('expBackBtn', ()=>{
  if(state.stack.length > 1){
    state.stack.pop();
    const prev = state.stack[state.stack.length-1];
    navigate(prev, true);
  } else {
    try{ Sound.click(); }catch(e){}
  }
});
rebind('expUpBtn', ()=>{
  if(state.current === GH.base) return;
  const parts = state.current.split('/');
  parts.pop();
  const up = parts.join('/') || GH.base;
  state.stack.push(state.current);
  navigate(up, true);
});
rebind('expRefreshBtn', ()=>{
  sessionStorage.removeItem(cacheKey(state.current));
  navigate(state.current, true);
});

/* View toggle */
const viewBtn = document.querySelector('.exp-view-btn');
if(viewBtn){
  const c = viewBtn.cloneNode(true);
  viewBtn.parentNode.replaceChild(c, viewBtn);
  c.onclick = ()=>{
    state.view = state.view === 'icons' ? 'list' : 'icons';
    renderItems(state.items);
    try{ Sound.click(); }catch(e){}
  };
}

/* Muat pertama kali (background) */
setTimeout(()=>{
  const appExpl = document.getElementById('app-explorer');
  if(appExpl && !appExpl.classList.contains('hidden')) navigate(GH.base, true);
}, 1200);

/* Kalau user langsung klik desktop icon explorer sebelum klik lain */
document.querySelectorAll('[data-open="explorer"]').forEach(el=>{
  el.addEventListener('click', ()=>{
    setTimeout(()=>{
      if(!state.items.length) navigate(GH.base, true);
    }, 100);
  }, true);
});

console.log('[XP Fix] Explorer sekarang membaca folder GitHub:', GH.owner+'/'+GH.repo+'/'+GH.base, '✓');
})();
</script>
