/* ─────────────────────────────────────────────────────────
   FIX 2: MATERI — ambil dari GitHub API (seperti index (2))
   ───────────────────────────────────────────────────────── */
const GH_OWNER = 'vickysegu';
const GH_REPO  = 'vickysegu.github.io';
const GH_BASE  = 'Materi';

const GH = { current: GH_BASE, history: [], items: [], view: 'icons' };

function ghIcon(ext){
  ext = (ext||'').toLowerCase();
  if(/^(png|jpg|jpeg|gif|webp|svg|bmp|avif)$/.test(ext)) return '🖼️';
  if(/^(mp4|webm|ogv|mov|avi|m4v)$/.test(ext)) return '🎬';
  if(/^(mp3|wav|ogg|m4a|aac|flac)$/.test(ext)) return '🎵';
  if(ext==='pdf') return '📕';
  if(/^(docx?|odt|rtf)$/.test(ext)) return '📘';
  if(/^(xlsx?|ods|csv)$/.test(ext)) return '📗';
  if(/^(pptx?|odp)$/.test(ext)) return '📙';
  if(/^(html?|htm)$/.test(ext)) return '🌐';
  if(/^(zip|rar|7z|tar|gz)$/.test(ext)) return '🗜️';
  if(/^(txt|md|json|xml|log|yml|yaml)$/.test(ext)) return '📝';
  if(/^(js|ts|py|java|c|cpp|h|css|php|rb|go|sql|sh)$/.test(ext)) return '📄';
  return '📎';
}
function ghFmtSize(b){
  if(!b) return '';
  if(b<1024) return b+' B';
  if(b<1048576) return Math.round(b/1024)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

async function renderExplorerGitHub(){
  const filesEl = document.getElementById('expFiles');
  const crumb   = document.getElementById('expCrumb');
  const status  = document.getElementById('expStatus');
  const title   = document.getElementById('expTitle');
  const treeEl  = document.getElementById('expTreeItems');
  if(!filesEl) return;

  filesEl.className = 'exp-files' + (GH.view==='list' ? ' list-view' : '');
  filesEl.innerHTML = '<div style="grid-column:1/-1;padding:20px;color:#666;display:flex;gap:10px;align-items:center;"><div style="width:16px;height:16px;border:2px solid #ccc;border-top-color:#3d7ad4;border-radius:50%;animation:iespin .8s linear infinite;"></div> Memuat dari GitHub…</div>';
  if(status) status.textContent = 'Loading…';

  const apiUrl = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH.current}`;

  try{
    const res = await fetch(apiUrl);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const files = await res.json();
    if(!Array.isArray(files)) throw new Error('Response bukan array');

    GH.items = files;
    const folderName = GH.current.split('/').pop() || 'Materi';
    if(title) title.textContent = folderName;

    // Breadcrumb
    if(crumb){
      const parts = GH.current.split('/');
      crumb.innerHTML = parts.map((p,i)=>{
        const isLast = i===parts.length-1;
        const path = parts.slice(0,i+1).join('/');
        return `<span class="exp-crumb${isLast?' current':''}" data-path="${path}" style="cursor:pointer;${isLast?'':'color:#2f6fed;'}">${i===0?'📁 ':'📂 '}${p}</span>`;
      }).join('<span class="exp-sep-b">▸</span>');
      crumb.querySelectorAll('.exp-crumb').forEach(c=>{
        c.onclick = () => {
          if(c.classList.contains('current')) return;
          GH.history.push(GH.current);
          GH.current = c.dataset.path;
          renderExplorerGitHub();
        };
      });
    }

    // Files
    if(!files.length){
      filesEl.innerHTML = '<div style="grid-column:1/-1;padding:24px;color:#666;">Folder kosong.</div>';
    } else {
      filesEl.innerHTML = files.map((f,i)=>{
        const isDir = f.type==='dir';
        const ext = !isDir ? (f.name.split('.').pop()||'') : '';
        const icon = isDir ? '📁' : ghIcon(ext);
        const meta = isDir ? 'Folder' : (ghFmtSize(f.size) + (ext ? ' · '+ext.toUpperCase() : ''));
        return `<div class="exp-file" data-idx="${i}">
          <div class="exp-file-icon">${icon}</div>
          <div class="exp-file-name">${f.name}</div>
          <div class="exp-file-meta">${meta}</div>
        </div>`;
      }).join('');

      filesEl.querySelectorAll('.exp-file').forEach((el,idx)=>{
        const file = files[idx];
        el.onclick = () => {
          filesEl.querySelectorAll('.exp-file').forEach(x=>x.classList.remove('active'));
          el.classList.add('active');
          try{ Sound.click(); }catch(e){}
        };
        el.ondblclick = () => openGHFile(file);
        el.oncontextmenu = e => {
          e.preventDefault();
          const isDir = file.type==='dir';
          const webUrl = `https://${GH_OWNER}.github.io/${file.path}`;
          const items = [
            {label:'Open', ico:'📂', handler:()=>openGHFile(file)},
            !isDir && {label:'Buka di Tab Baru', ico:'↗️', handler:()=>window.open(webUrl,'_blank','noopener')},
            !isDir && {label:'Download', ico:'⬇️', handler:()=>{
              const a=document.createElement('a'); a.href=file.download_url; a.download=file.name; a.click();
            }},
            '---',
            {label:'Properties', ico:'⚙️', handler:()=>{
              try{ showDialog(file.name, isDir?'📁':'📄',
                `Tipe: ${isDir?'Folder':'File'}<br>Ukuran: ${isDir?'-':ghFmtSize(file.size)}<br>Path: ${file.path}`, null); }catch(e){}
            }}
          ].filter(Boolean);
          try{ showContextMenu(e.clientX, e.clientY, items); }catch(e){}
        };
      });
    }

    // Sidebar tree (folder-folder)
    if(treeEl){
      treeEl.querySelectorAll('.exp-tree-item').forEach(x=>x.remove());
      const dirs = files.filter(f=>f.type==='dir');
      if(dirs.length === 0){
        const empty = document.createElement('div');
        empty.style.cssText = 'padding:10px;color:#8892a3;font-size:11px;';
        empty.textContent = 'Tidak ada subfolder';
        treeEl.appendChild(empty);
      } else {
        dirs.forEach(d=>{
          const el = document.createElement('div');
          el.className = 'exp-tree-item';
          el.innerHTML = `<span class="ic">📁</span><span>${d.name}</span>`;
          el.onclick = () => {
            GH.history.push(GH.current);
            GH.current = d.path;
            renderExplorerGitHub();
            try{ Sound.click(); }catch(e){}
          };
          treeEl.appendChild(el);
        });
      }
    }

    if(status) status.textContent = files.length + ' objects';
  } catch(err){
    console.error('[Materi] Gagal fetch GitHub:', err);
    filesEl.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:30px;">
      <div style="font-size:40px;margin-bottom:10px;">⚠️</div>
      <div style="font-weight:700;color:#c33;">Gagal memuat dari GitHub</div>
      <div style="font-size:11px;color:#666;margin-top:6px;">${err.message}</div>
      <div style="font-size:11px;color:#666;margin-top:6px;">Pastikan repo <b>${GH_OWNER}/${GH_REPO}</b> publik dan folder <b>${GH_BASE}</b> ada.</div>
      <button onclick="window.renderExplorer()" style="margin-top:12px;padding:6px 14px;background:linear-gradient(180deg,#3d7ad4,#1e56c8);color:#fff;border:none;border-radius:3px;cursor:pointer;font-weight:600;">Coba Lagi</button>
    </div>`;
    if(status) status.textContent = 'Error';
  }
}

function openGHFile(file){
  if(file.type === 'dir'){
    GH.history.push(GH.current);
    GH.current = file.path;
    renderExplorerGitHub();
    return;
  }
  const webUrl = `https://${GH_OWNER}.github.io/${file.path}`;
  window.open(webUrl, '_blank', 'noopener');
}

window.renderExplorer = renderExplorerGitHub;

/* ─────────────────────────────────────────────────────────
   FIX 3: Pasang listener baru (strip yang lama dulu)
   ───────────────────────────────────────────────────────── */
function rebind(id, handler){
  const el = document.getElementById(id);
  if(!el) return;
  const clone = el.cloneNode(true);
  el.parentNode.replaceChild(clone, el);
  clone.onclick = handler;
}

rebind('expBackBtn', () => {
  if(GH.history.length){
    GH.current = GH.history.pop();
    renderExplorerGitHub();
  } else {
    try{ Sound.click(); }catch(e){}
  }
});

rebind('expUpBtn', () => {
  if(GH.current === GH_BASE) return;
  const parts = GH.current.split('/');
  parts.pop();
  GH.history.push(GH.current);
  GH.current = parts.join('/') || GH_BASE;
  renderExplorerGitHub();
});

rebind('expRefreshBtn', () => {
  renderExplorerGitHub();
});

// View toggle
const viewBtn = document.querySelector('.exp-view-btn');
if(viewBtn){
  const clone = viewBtn.cloneNode(true);
  viewBtn.parentNode.replaceChild(clone, viewBtn);
  clone.onclick = () => {
    GH.view = GH.view === 'icons' ? 'list' : 'icons';
    renderExplorerGitHub();
    try{ Sound.click(); }catch(e){}
  };
}

/* ─────────────────────────────────────────────────────────
   FIX 4: Panggil otomatis saat window dibuka
   ───────────────────────────────────────────────────────── */
const _origOpenApp = window.openApp;
window.openApp = function(id){
  const r = _origOpenApp.apply(this, arguments);
  if(id === 'control')  setTimeout(()=>{ try{ renderProfileFixed(); }catch(e){console.warn(e);} }, 60);
  if(id === 'explorer') setTimeout(()=>{ try{ renderExplorerGitHub(); }catch(e){console.warn(e);} }, 60);
  return r;
};

// Kalau sudah login, langsung render sekarang
function tryInitialRender(){
  const welcomeGone = document.getElementById('welcomeScreen')?.classList.contains('hidden');
  if(!welcomeGone) return;
  try{ renderProfileFixed(); }catch(e){}
  try{ renderExplorerGitHub(); }catch(e){}
}
// Cek beberapa kali (untuk handle kalau welcome belum diklik)
let tries = 0;
const iv = setInterval(()=>{
  tries++;
  tryInitialRender();
  if(tries > 40) clearInterval(iv); // stop setelah ~10 detik
}, 250);

// Juga hook ke welcome user click (kalau belum login)
document.querySelectorAll('.welcome-user').forEach(u=>{
  u.addEventListener('click', ()=>{ setTimeout(tryInitialRender, 200); });
});

console.log('[XP Fix] Profil & Materi (GitHub) sudah di-patch.');
})();
</script>
