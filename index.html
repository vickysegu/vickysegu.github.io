<style>
:root{--font-system:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;--text-primary:#fff;--text-secondary:rgba(255,255,255,.92);--text-tertiary:rgba(255,255,255,.78);--accent:#22c55e;--danger:#ef4444;--ln:rgba(255,255,255,.2);--fl:rgba(255,255,255,.1);--card:rgba(0,0,0,.25);--ov:rgba(10,20,35,.55);--gA:rgba(255,255,255,.12);--gB:rgba(255,255,255,.02);--nav:rgba(15,23,42,.75);--ind:rgba(255,255,255,.22);--radius-pill:9999px;--radius-xl:32px;--radius-lg:20px;--radius-md:16px;--safe-top:env(safe-area-inset-top,20px);--safe-bottom:env(safe-area-inset-bottom,20px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--font-system);background-color:#0f172a;background-image:url('bg.webp'),url('https://images.unsplash.com/photo-1723621901726-eacc52c8fc4d?q=80&w=2070&auto=format');background-position:center;background-size:cover;background-attachment:fixed;color:var(--text-primary);display:flex;align-items:center;justify-content:center;padding:calc(var(--safe-top) + 30px) 20px var(--safe-bottom);-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;background:var(--ov);z-index:-1}
button,input,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* LIQUID GLASS: lapisan kaca di pseudo-element, jadi anak (navbar fixed) tidak terjebak backdrop-filter */
.glass-panel{background:linear-gradient(135deg,rgba(255,255,255,.12) 0%,rgba(255,255,255,.02) 100%);backdrop-filter:blur(15px) saturate(180%);-webkit-backdrop-filter:blur(15px) saturate(180%);border:1px solid rgba(255,255,255,.2);border-top:1px solid rgba(255,255,255,.5);border-left:1px solid rgba(255,255,255,.4);box-shadow:inset 0 1px 1px rgba(255,255,255,.2),0 16px 40px rgba(0,0,0,.4);border-radius:var(--radius-xl)}

.app-container{width:100%;max-width:1100px;height:100%;max-height:850px;display:flex;flex-direction:column;gap:20px}
@media (min-width:768px){.app-container{flex-direction:row;height:85vh}body{padding:var(--safe-top) 20px var(--safe-bottom)}}

/* SIDEBAR */
.sidebar{position:relative;flex:0 0 auto;padding:22px;display:flex;align-items:center;gap:18px;overflow:hidden}
.sidebar::before{content:'';position:absolute;top:-90px;left:-70px;width:260px;height:260px;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 65%);pointer-events:none}
.sidebar>*{position:relative}
.avatar-wrapper{width:84px;height:84px;flex-shrink:0;border-radius:var(--radius-pill);padding:4px;background:conic-gradient(from 200deg,var(--accent),rgba(255,255,255,.65),rgba(255,255,255,.12),var(--accent));box-shadow:0 10px 28px rgba(0,0,0,.35),0 0 34px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .35s cubic-bezier(.34,1.3,.64,1)}
.avatar-wrapper:hover{transform:scale(1.05)}
.avatar-inner{width:100%;height:100%;border-radius:inherit;background:#1e293b;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid rgba(15,23,42,.6)}
#cv-photo{max-width:100%;max-height:100%;object-fit:contain;background:#1e293b;border-radius:inherit}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:21px;font-weight:800;letter-spacing:-.4px;line-height:1.2;margin-bottom:14px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.info-list{list-style:none;text-align:left;background:var(--fl);border:1px solid var(--ln);border-radius:var(--radius-md);padding:4px}
.info-list li{display:flex;align-items:center;gap:10px;padding:8px 10px}
.info-list li+li{border-top:1px solid var(--ln)}
.info-list i{width:28px;height:28px;flex-shrink:0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.info-list span{display:flex;flex-direction:column;min-width:0}
.info-list small{font-size:11px;font-weight:600;color:var(--text-tertiary)}
.info-list b{font-size:13px;font-weight:700;line-height:1.3;word-break:break-word}
.skill-chips{display:none;flex-wrap:wrap;gap:6px}
.skill-chips span{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:var(--radius-pill);background:var(--fl);border:1px solid var(--ln);color:var(--text-secondary)}
.social-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.social-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-pill);background:var(--fl);color:var(--text-primary);border:1px solid var(--ln);text-decoration:none;transition:.2s;position:relative;overflow:hidden;cursor:pointer;font-size:14px}
.social-btn::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,50%),var(--accent),transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.social-btn:hover{transform:translateY(-2px);border-color:var(--text-tertiary)}.social-btn:hover::before{opacity:.5}
.pill-btn{width:auto;padding:0 15px;gap:7px;font-size:13px;font-weight:700;font-family:inherit;background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
@media (max-width:767px){.pill-btn span{display:none}.pill-btn{width:38px;padding:0}.info-list small{display:none}.info-list li{padding:5px 8px}.info-list i{width:24px;height:24px}}
@media (min-width:768px){
.sidebar{flex:0 0 320px;flex-direction:column;text-align:center;padding:40px 28px;justify-content:center;gap:0}
.sidebar::before{top:-90px;left:50%;transform:translateX(-50%)}
.avatar-wrapper{width:148px;height:148px;margin-bottom:20px}
.profile-name{font-size:27px;margin-bottom:18px}
.info-list{width:100%}
.skill-chips{display:flex;justify-content:center;margin-top:16px}
.social-links{justify-content:center;margin-top:18px;gap:6px}}

/* MAIN + TAB */
.main-window{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;min-width:0}
.window-header{position:relative;padding:12px 14px;border-bottom:1px solid var(--ln);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.window-header::-webkit-scrollbar{display:none}
.nav-ind{position:absolute;top:var(--t,0);left:0;height:var(--h,0);width:var(--w,0);transform:translateX(var(--x,0));background:var(--ind);border:1px solid var(--ln);border-radius:var(--radius-pill);box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 4px 12px rgba(0,0,0,.15);pointer-events:none}
.nav-ind.ready{transition:transform .5s cubic-bezier(.34,1.45,.64,1),width .5s cubic-bezier(.34,1.45,.64,1)}
.nav-tab{position:relative;z-index:1;padding:8px 13px;border-radius:var(--radius-pill);border:1px solid transparent;background:transparent;color:var(--text-tertiary);font-size:13px;font-weight:700;cursor:pointer;transition:color .2s;display:flex;align-items:center;gap:6px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.nav-tab:hover,.nav-tab.active{color:var(--text-primary)}
.badge-count{background:var(--accent);color:#0f172a;padding:1px 6px;border-radius:20px;font-size:10.5px;font-weight:800;margin-left:2px;min-width:18px;text-align:center}
.search{display:flex;align-items:center;gap:10px;margin:14px 20px 0;padding:0 14px;height:42px;background:var(--fl);border:1px solid var(--ln);border-radius:var(--radius-pill);flex-shrink:0;color:var(--text-tertiary)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text-primary);font-size:14px;font-weight:500}
.search input::placeholder{color:var(--text-tertiary)}
.search button{display:none;background:none;border:0;color:var(--text-tertiary);cursor:pointer;width:24px;height:24px;align-items:center;justify-content:center}
.window-body{flex:1;overflow-y:auto;padding:24px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.window-body::-webkit-scrollbar{width:6px}.window-body::-webkit-scrollbar-thumb{background:var(--ln);border-radius:10px}
.content-section{display:none}.content-section.active{display:block}
body.searching .content-section.active{display:none}body.searching #tab-search{display:block}
.section-title{font-size:18px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.section-title i{color:var(--accent)}
.grid-list{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:1024px){.grid-list{grid-template-columns:1fr 1fr}}

/* KARTU */
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.content-section.active .glass-card,body.searching #tab-search .glass-card {animation:rise .45s backwards;animation-delay:calc(var(--i,0)*40ms)}
.glass-card{background:rgba(0,0,0,.25);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-lg);padding:16px;box-shadow:inset 0 1px 1px rgba(255,255,255,.08);display:flex;gap:16px;transition:all .25s cubic-bezier(.34,1.1,.64,1);position:relative;overflow:hidden}
.glass-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle at var(--x,50%) var(--y,50%),var(--accent),transparent 60%);opacity:0;transition:opacity .3s ease;pointer-events:none;z-index:0}
.glass-card:hover::before{opacity:.35}
.glass-card>*{position:relative;z-index:1}
.glass-card:hover{transform:translateY(-3px);background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.28)}
.card-icon{width:46px;height:46px;flex-shrink:0;border-radius:var(--radius-md);background:var(--fl);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.card-info{flex:1;min-width:0}
.item-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.4;word-break:break-word}
.item-title a{color:inherit;text-decoration:none}.item-title a:hover{color:var(--accent)}
.item-desc{font-size:13px;color:var(--text-tertiary);margin-bottom:8px}
.item-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{background:var(--fl);border:1px solid var(--ln);border-radius:6px;padding:4px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge.highlight{color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);border-color:color-mix(in srgb,var(--c,var(--accent)) 45%,transparent)}
.semester-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--fl);border:1px solid var(--ln);padding:4px 10px;border-radius:var(--radius-pill);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.mini{background:var(--fl);border:1px solid var(--ln);color:var(--text-primary);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:600;cursor:pointer;margin-left:auto}
.mini:hover{border-color:var(--accent);color:var(--accent)}

/* FILTER CHIP */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.fc{background:var(--fl);border:1px solid var(--ln);color:var(--text-secondary);border-radius:var(--radius-pill);padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;display:flex;gap:6px;align-items:center;transition:.2s}
.fc:hover{border-color:var(--text-tertiary)}.fc.on{background:var(--ind);color:var(--text-primary);border-color:var(--text-tertiary)}
.fc b{font-size:11px;font-weight:800;opacity:.75}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
select,.gh-q{background:var(--fl);border:1px solid var(--ln);color:var(--text-primary);border-radius:var(--radius-pill);padding:8px 14px;font-size:13px;font-weight:600}
select option{color:#0f172a}
.gh-q{flex:1;min-width:140px;outline:0}.gh-q:focus{border-color:var(--accent)}

.idl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px;flex:1;min-width:0}
.idl dt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;color:var(--text-tertiary);margin-bottom:2px}
.idl dd{font-size:14px;font-weight:700;word-break:break-word}
.sub-title{font-size:16px;font-weight:800;margin:26px 0 14px;display:flex;align-items:center;gap:10px}
.sub-title i{color:var(--accent)}

/* KAMPUS ACCORDION */
.campus-group{margin-bottom:24px}
.campus-title{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;color:var(--text-secondary);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ln);cursor:pointer;list-style:none}
.campus-title::-webkit-details-marker{display:none}
.campus-title>i:first-child{color:var(--accent)}
.campus-title small{font-size:12px;font-weight:600;color:var(--text-tertiary);margin-left:auto}
.chev{font-size:12px;transition:transform .3s}details[open] .chev{transform:rotate(180deg)}

/* GITHUB */
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-bottom:12px;font-size:13px;font-weight:700}
.crumb button{background:none;border:0;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:8px;font-weight:700}
.crumb button:hover{background:var(--fl)}.crumb button:last-child{color:var(--accent)}
.crumb i{font-size:10px;color:var(--text-tertiary)}

/* SKELETON, EMPTY, ERROR */
.sk .card-icon,.sk-l{background:linear-gradient(90deg,var(--fl) 25%,rgba(255,255,255,.28) 50%,var(--fl) 75%);background-size:200% 100%;animation:sh 1.3s infinite}
.sk-l{height:12px;border-radius:6px;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.empty-state{grid-column:1/-1;text-align:center;padding:32px 20px;color:var(--text-tertiary);font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty-state i{font-size:28px;opacity:.5}
.error-box{grid-column:1/-1;text-align:center;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:12px}
.error-box>i{font-size:42px;color:var(--danger)}
.error-box h3{font-size:16px;font-weight:800;color:var(--danger)}
.error-box p{font-size:13px;color:var(--text-tertiary);line-height:1.55;max-width:420px}
.error-box code{background:rgba(0,0,0,.35);color:#fca5a5;padding:2px 6px;border-radius:4px;font-size:12px}
.retry-btn{padding:10px 20px;border-radius:var(--radius-pill);background:var(--accent);color:#0f172a;border:0;cursor:pointer;font-weight:800;font-size:13px}

/* NOTIF */
#chip-notif{position:fixed;top:0;left:50%;transform:translate(-50%,-30px);z-index:9999;opacity:0;transition:opacity .35s,transform .35s cubic-bezier(.34,1.3,.64,1);background:rgba(20,25,40,.75);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);border:1px solid rgba(255,255,255,.25);color:#fff;padding:12px 22px;border-radius:40px;font-size:13.5px;font-weight:600;max-width:calc(100vw - 32px);box-shadow:0 12px 40px rgba(0,0,0,.35);display:none;align-items:center;gap:8px}
#chip-notif.show{display:flex}
.checkmark{font-size:16px;color:#22c55e;transition:transform .25s}.checkmark.animate{transform:scale(1.35)}.checkmark.warn{color:#facc15}

@media (min-width:768px) and (max-width:1099px){.nav-tab:not(.active) .tab-text{display:none}.nav-tab:not(.active) .badge-count{display:none}}
/* MOBILE */
@media (max-width:767px){
.window-header{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:16px;right:16px;z-index:1000;background:var(--nav);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--ln);border-radius:32px;padding:8px 12px;justify-content:space-between;gap:4px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.window-body{padding-bottom:110px}
.nav-tab{flex-direction:column;padding:8px 6px;gap:4px;flex:1;min-height:64px;justify-content:center}
.nav-tab i{font-size:20px}.nav-tab .tab-text{font-size:10.5px}
.badge-count{position:absolute;top:6px;right:8px;margin-left:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

  /* ===== VISITOR COUNTER ===== */
.visitor-chip{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  padding:7px 14px;border-radius:var(--radius-pill);
  background:var(--fl);border:1px solid var(--ln);
  font-size:12px;font-weight:700;color:var(--text-secondary);
  transition:.2s;position:relative;overflow:hidden;
}
.visitor-chip:hover{border-color:var(--text-tertiary);transform:translateY(-1px)}
.visitor-chip>i{color:var(--accent);font-size:12px}
.visitor-chip small{
  font-size:10px;font-weight:600;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.4px;
}
/* nilai angka & elemen hasil injeksi script */
#visitor-counter span,.visitor-counter span,
#visitor-count{
  color:var(--text-primary);font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
}
#visitor-counter img,.visitor-counter img{height:16px;width:auto;vertical-align:middle;border-radius:3px}
#visitor-counter a,.visitor-counter a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
@media (max-width:767px){
  .visitor-chip{margin-top:10px;padding:5px 11px;font-size:11px}
  .visitor-chip small{display:none} /* samakan dgn pola .pill-btn span */
}
  
</style>
</head>
<body>

<div id="chip-notif" role="status" aria-live="polite"><span class="checkmark">✓</span><span class="chip-text"></span></div>

<div class="app-container">
<aside class="glass-panel sidebar">
  <div class="avatar-wrapper"><div class="avatar-inner">
    <img id="cv-photo" src="profile.jpg" alt="Foto Vicky Setia Gunawan" onerror="this.style.display='none';document.getElementById('cv-fb').style.display='block'">
    <i id="cv-fb" class="fa-solid fa-user" style="display:none;font-size:48px;color:#94a3b8"></i>
  </div></div>
  <div class="profile-info">
    <h1 class="profile-name" id="prof-name">—</h1>
    <ul class="info-list">
      <li><i class="fa-solid fa-id-badge"></i><span><small>NIDN</small><b id="prof-nidn">—</b></span></li>
      <li><i class="fa-solid fa-laptop-code"></i><span><small>Program studi</small><b id="prof-prodi">—</b></span></li>
      <li><i class="fa-solid fa-building-columns"></i><span><small>Perguruan tinggi</small><b id="prof-pt">—</b></span></li>
    </ul>
    <div class="skill-chips" aria-label="Bidang keahlian"><span>Sistem Informasi</span><span>Kecerdasan Buatan</span><span>Pemrograman Web</span></div>
    <div class="social-links">
      <button class="social-btn pill-btn" data-act="email" title="Salin email" aria-label="Salin email"><i class="fa-regular fa-copy"></i><span>Salin email</span></button>
      <a href="https://www.linkedin.com/in/vickysetiagunawan/" class="social-btn" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
      <a href="https://scholar.google.com/citations?user=zxh3WngAAAAJ&hl=en" class="social-btn" target="_blank" rel="noopener" title="Google Scholar" aria-label="Google Scholar"><i class="fa-solid fa-graduation-cap"></i></a>
      <a href="https://sinta.kemdiktisaintek.go.id/authors/profile/6902246" class="social-btn" target="_blank" rel="noopener" title="SINTA" aria-label="SINTA"><i class="fa-solid fa-chart-line"></i></a>
    </div>
    <!-- BARU: penampung visitor counter -->

<script>
'use strict';
const $=id=>document.getElementById(id);
const CAT={edu:{c:'#facc15',i:'fa-graduation-cap',l:'Pendidikan'},teach:{c:'#60a5fa',i:'fa-chalkboard-user',l:'Mengajar'},pub:{c:'#22c55e',i:'fa-book-open',l:'Publikasi'},srv:{c:'#f472b6',i:'fa-handshake-angle',l:'Pengabdian'}};
const TABS=['edu','teach','pub','srv','github'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const empty=(i,t)=>`<div class="empty-state"><i class="fa-solid ${i}"></i><span>${esc(t)}</span></div>`;
const skel=n=>Array.from({length:n},()=>`<div class="glass-card sk"><div class="card-icon"></div><div class="card-info"><div class="sk-l" style="width:75%"></div><div class="sk-l" style="width:45%"></div></div></div>`).join('');
const latestYear=s=>{const y=[...String(s||'').matchAll(/\d{4}/g)].map(m=>+m[0]);return y.length?Math.max(...y):0};
const tc=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
const semesters=s=>String(s||'').split(',').map(x=>x.trim()).filter(Boolean);
const campusYear=k=>Math.max(0,...(k.mata_kuliah||[]).map(m=>latestYear(m.semester)));

let DATA=null,EV=[],cur='edu',ghInit=false,hue=null;
const pubS={j:'all',y:'all',s:'new'},scrollPos=new Map();

/* skeleton awal */
$('edu-content').innerHTML=`<div class="grid-list">${skel(2)}</div>`;
$('pub-content').innerHTML=skel(4);$('srv-content').innerHTML=skel(4);
$('teach-content').innerHTML=`<div class="grid-list">${skel(4)}</div>`;

/* ============ NOTIF + SALIN ============ */
function showChip(text,warn){
  const chip=$('chip-notif');if(!chip)return;
  const check=chip.querySelector('.checkmark'),txt=chip.querySelector('.chip-text');
  check.classList.toggle('warn',!!warn);check.textContent=warn?'⚠':'✓';txt.textContent=text;
  chip.classList.add('show');
  requestAnimationFrame(()=>{chip.style.opacity='1';chip.style.transform='translate(-50%,20px)'});
  check.classList.add('animate');setTimeout(()=>check.classList.remove('animate'),300);
  clearTimeout(showChip._t);
  showChip._t=setTimeout(()=>{chip.style.opacity='0';chip.style.transform='translate(-50%,-30px)';setTimeout(()=>chip.classList.remove('show'),350)},2000);
}
async function copyText(text,okMsg){
  try{
    if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);
    else{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}
    showChip(okMsg);
  }catch(e){showChip('Gagal menyalin',true)}
}

/* ============ TEMA + AKSEN ============ */
function applyAccent(){
  if(hue===null)return;
  const a=`hsl(${hue},70%,55%)`;
  document.documentElement.style.setProperty('--accent',a);
}
function extractAccent(){
  const m=getComputedStyle(document.body).backgroundImage.match(/url\(["']?([^"')]+)["']?\)/g);
  if(!m)return;
  const tryUrl=i=>{
    if(i>=m.length)return;
    const img=new Image();img.crossOrigin='Anonymous';img.src=m[i].replace(/url\(["']?|["']?\)/g,'');
    img.onload=()=>{try{
      const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.drawImage(img,0,0,64,64);
      const d=x.getImageData(0,0,64,64).data;let r=0,g=0,b=0;const n=d.length/4;
      for(let k=0;k<d.length;k+=4){r+=d[k];g+=d[k+1];b+=d[k+2]}
      r/=n;g/=n;b/=n;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0;
      if(mx!==mn){h=mx===r?60*((g-b)/(mx-mn)):mx===g?60*(2+(b-r)/(mx-mn)):60*(4+(r-g)/(mx-mn));if(h<0)h+=360}
      hue=Math.round(h);applyAccent();
    }catch(e){}};
    img.onerror=()=>tryUrl(i+1);
  };tryUrl(0);
}

/* ============ TAB, HASH, INDIKATOR ============ */
function placeInd(){
  const h=$('nav'),b=h.querySelector('.nav-tab.active');if(!b)return;
  h.style.setProperty('--x',b.offsetLeft+'px');h.style.setProperty('--w',b.offsetWidth+'px');
  h.style.setProperty('--t',b.offsetTop+'px');h.style.setProperty('--h',b.offsetHeight+'px');
}
function activate(id){
  if(!TABS.includes(id))id='edu';
  const a=$('scroll-area');scrollPos.set(cur,a.scrollTop);
  document.querySelectorAll('.content-section').forEach(e=>e.classList.toggle('active',e.id==='tab-'+id));
  document.querySelectorAll('.nav-tab').forEach(b=>{const on=b.dataset.tab===id;b.classList.toggle('active',on);b.setAttribute('aria-selected',on);b.tabIndex=on?0:-1});
  cur=id;a.scrollTop=scrollPos.get(id)||0;placeInd();
  if(id==='github'&&!ghInit){ghInit=true;loadGitHubFiles(ghBase)}
}
function goTab(id){if(location.hash==='#'+id)activate(id);else location.hash=id}
window.addEventListener('hashchange',()=>{setSearch('');activate((location.hash||'#edu').slice(1))});
window.addEventListener('resize',placeInd);
$('nav').addEventListener('click',e=>{const b=e.target.closest('.nav-tab');if(!b)return;if(navigator.vibrate)navigator.vibrate(8);setSearch('');goTab(b.dataset.tab)});
$('nav').addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  const i=TABS.indexOf(cur),n=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;
  goTab(TABS[n]);$('tabbtn-'+TABS[n]).focus();
});
/* swipe */
let tx=0,ty=0;const sa=$('scroll-area');
sa.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
sa.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*2||document.body.classList.contains('searching'))return;
  const n=TABS.indexOf(cur)+(dx<0?1:-1);if(n>=0&&n<TABS.length)goTab(TABS[n]);
},{passive:true});

/* ============ KARTU ============ */
function body(e){
  const c=CAT[e.k];
  const t=e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener">${esc(e.t)} <i class="fa-solid fa-up-right-from-square" style="font-size:10px"></i></a>`:esc(e.t);
  return `<div class="card-icon" style="color:${c.c}"><i class="fa-solid ${c.i}"></i></div><div class="card-info"><div class="item-title">${t}</div><div class="item-meta">${(e.b||[]).filter(Boolean).map(b=>`<span class="badge">${esc(b)}</span>`).join('')}${e.h?`<span class="badge highlight">${esc(e.h)}</span>`:''}</div>${e.chips&&e.chips.length?`<div class="semester-chips">${e.chips.map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div>`:''}</div>`;
}
function buildEvents(d){
  const ev=[];
  (d.pendidikan||[]).forEach(e=>ev.push({k:'edu',y:+e.tahun||0,t:e.pt,b:[`${e.jenjang||''} • ${e.prodi&&e.prodi!=='N/A'?e.prodi:'-'}`],h:`Lulus ${e.tahun||'—'}`}));
  (d.mengajar||[]).forEach(k=>(k.mata_kuliah||[]).forEach(m=>ev.push({k:'teach',y:latestYear(m.semester),t:m.nama,b:[k.nama_kampus||'Kampus'],h:'Mengajar',chips:semesters(m.semester)})));
  (d.publikasi||[]).forEach(p=>{const s=parseInt(p.sitasi||0,10);ev.push({k:'pub',y:parseInt(p.tahun)||0,t:p.judul,link:p.link,b:[p.jenis],h:s>0?`${s} sitasi`:''})});
  (d.pengabdian||[]).forEach(p=>ev.push({k:'srv',y:parseInt(p.tahun)||0,t:p.judul,b:[],h:p.kategori}));
  return ev;
}

/* ============ PROFIL ============ */
function renderProfile(){
  const E=[...(DATA.pendidikan||[])].sort((a,b)=>(parseInt(b.tahun,10)||0)-(parseInt(a.tahun,10)||0));
  $('edu-content').innerHTML=`<h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Pendidikan</h2><div class="grid-list">${E.length?E.map((e,n)=>`<div class="glass-card" style="--i:${Math.min(n,12)}"><div class="card-icon"><i class="fa-solid fa-graduation-cap"></i></div><div class="card-info"><div class="item-title">${esc(e.pt)}</div><div class="item-desc">${esc(e.jenjang)} • ${esc(e.prodi&&e.prodi!=='N/A'?e.prodi:'-')}</div><div class="item-meta"><span class="badge highlight">Lulus ${esc(e.tahun)}</span></div></div></div>`).join(''):empty('fa-graduation-cap','Belum ada data pendidikan.')}</div>`;
}

/* ============ MENGAJAR (ACCORDION) ============ */
function renderTeach(){
  const M=DATA.mengajar||[];let tot=0;
  if(!M.length){$('teach-content').innerHTML=empty('fa-chalkboard','Belum ada data mengajar.');$('count-teach').textContent='0';return}
  $('teach-content').innerHTML=[...M].sort((a,b)=>campusYear(b)-campusYear(a)).map((k,ki)=>{
    const ms=[...(k.mata_kuliah||[])].sort((a,b)=>latestYear(b.semester)-latestYear(a.semester));
    tot+=ms.length;const ly=campusYear(k);
    return `<details class="campus-group" ${ki===0?'open':''}><summary class="campus-title"><i class="fa-solid fa-building-columns"></i><span>${esc(k.nama_kampus||'Kampus')}</span><small>${ms.length} mata kuliah${ly?` • terakhir ${ly}`:''}</small><i class="fa-solid fa-chevron-down chev"></i></summary><div class="grid-list">${ms.map((m,n)=>`<div class="glass-card" style="--i:${Math.min(n,12)}"><div class="card-icon"><i class="fa-solid fa-chalkboard"></i></div><div class="card-info"><div class="item-title">${esc(m.nama)}</div><div class="semester-chips">${semesters(m.semester).map(s=>`<span class="chip">${esc(s)}</span>`).join('')}</div></div></div>`).join('')}</div></details>`;
  }).join('');
  $('count-teach').textContent=tot;
}

/* ============ PUBLIKASI (FILTER + URUT + SALIN) ============ */
function renderPubFilters(){
  const P=DATA.publikasi||[];
  const js=[...new Set(P.map(p=>p.jenis).filter(Boolean))],ys=[...new Set(P.map(p=>p.tahun).filter(Boolean))].sort((a,b)=>b-a);
  $('pub-filters').innerHTML=`<div class="chips"><button class="fc on" data-j="all">Semua</button>${js.map(j=>`<button class="fc" data-j="${esc(j)}">${esc(j)}</button>`).join('')}</div><div class="row"><select id="pub-y" aria-label="Filter tahun"><option value="all">Semua tahun</option>${ys.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('')}</select><select id="pub-s" aria-label="Urutkan"><option value="new">Terbaru</option><option value="cite">Sitasi terbanyak</option><option value="old">Terlama</option></select></div>`;
}
function renderPubList(){
  const num=v=>parseInt(v,10)||0;
  const L=(DATA.publikasi||[]).map((p,i)=>({p,i})).filter(({p})=>(pubS.j==='all'||p.jenis===pubS.j)&&(pubS.y==='all'||String(p.tahun)===pubS.y));
  L.sort(pubS.s==='cite'?(a,b)=>num(b.p.sitasi)-num(a.p.sitasi)||num(b.p.tahun)-num(a.p.tahun):pubS.s==='old'?(a,b)=>num(a.p.tahun)-num(b.p.tahun):(a,b)=>num(b.p.tahun)-num(a.p.tahun));
  $('pub-content').innerHTML=L.length?L.map(({p,i},n)=>{
    const s=num(p.sitasi),t=p.link?`<a href="${esc(p.link)}" target="_blank" rel="noopener">${esc(p.judul)} <i class="fa-solid fa-up-right-from-square" style="font-size:10px"></i></a>`:esc(p.judul);
    return `<div class="glass-card" style="--i:${Math.min(n,12)}"><div class="card-icon">${esc(p.tahun||'—')}</div><div class="card-info"><div class="item-title">${t}</div><div class="item-meta"><span class="badge">${esc(p.jenis||'—')}</span>${s>0?`<span class="badge highlight"><i class="fa-solid fa-quote-right"></i> ${s}</span>`:''}<button class="mini" data-copy="${i}" aria-label="Salin sitasi"><i class="fa-regular fa-copy"></i> Salin</button></div></div></div>`;
  }).join(''):empty('fa-filter','Tidak ada publikasi untuk filter ini.');
}
$('pub-filters').addEventListener('click',e=>{
  const b=e.target.closest('[data-j]');if(!b)return;
  pubS.j=b.dataset.j;$('pub-filters').querySelectorAll('[data-j]').forEach(x=>x.classList.toggle('on',x===b));renderPubList();
});
$('pub-filters').addEventListener('change',e=>{
  if(e.target.id==='pub-y')pubS.y=e.target.value;if(e.target.id==='pub-s')pubS.s=e.target.value;renderPubList();
});

/* ============ PENCARIAN GLOBAL ============ */
function setSearch(q){const i=$('gs');if(i.value!==q)i.value=q;doSearch(q)}
function doSearch(q){
  q=q.trim().toLowerCase();
  document.body.classList.toggle('searching',!!q);
  $('gs-x').style.display=q?'flex':'none';
  if(!q)return;
  const r=EV.filter(e=>[e.t,e.h,...(e.b||[]),...(e.chips||[])].join(' ').toLowerCase().includes(q));

  $('search-content').innerHTML=r.length?r.slice(0,60).map((e,n)=>`<div class="glass-card" data-go="${e.k}" style="--c:${CAT[e.k].c};--i:${Math.min(n,12)};cursor:pointer">${body({...e,b:[CAT[e.k].l+(e.y?' • '+e.y:''),...(e.b||[])]})}</div>`).join(''):empty('fa-magnifying-glass','Tidak ada hasil. Coba kata kunci lain.');
}
$('gs').addEventListener('input',e=>doSearch(e.target.value));
$('gs-x').addEventListener('click',()=>{setSearch('');$('gs').focus()});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='/'&&!typing){e.preventDefault();$('gs').focus()}
  if(e.key==='Escape'&&$('gs').value){setSearch('')}
});

/* ============ KLIK TERPUSAT ============ */
document.addEventListener('click',e=>{
  const t=e.target;let b;
  if(b=t.closest('[data-act]')){
    copyText('vicky.setia@upertis.ac.id','Email berhasil disalin');

/* kilau mengikuti kursor (delegasi) */
document.addEventListener('mousemove',e=>{

    const el=e.target.closest(s);if(!el)return;

    el.style.setProperty('--x',((e.clientX-r.left)/r.width*100)+'%');

/* ============ DEDUPE ============ */
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function dedupe(list,score){
  const out=[];
  list.forEach(x=>{
    const n=norm(x.judul),i=out.findIndex(o=>o.n===n||(n.length>25&&String(o.x.tahun)===String(x.tahun)&&Math.abs(o.n.length-n.length)<=3&&lev(o.n,n)<=3));
    if(i<0)out.push({n,x});else if(score(x)>score(out[i].x))out[i].x=x;
  });
  return out.map(o=>o.x);
}

/* ============ LOAD DATA ============ */
async function loadData(){
  try{
    const res=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('HTTP '+res.status);
    const d=await res.json();
    if(!d||!d.profil)throw new Error('Struktur data tidak valid');
    DATA=d;const p=d.profil;
    d.publikasi=dedupe(d.publikasi||[],x=>(x.link?2:0)+(x.jenis!=='Lain-lain'?1:0));
    d.pengabdian=dedupe(d.pengabdian||[],x=>x.kategori==='Pengabdian'?1:0);
    $('prof-name').textContent=tc(p.nama)||'—';
    $('prof-nidn').textContent=p.nidn||'—';
    $('prof-prodi').textContent=tc(p.nama_prodi)||'—';
    $('prof-pt').textContent=tc(p.nama_pt)||'—';
    EV=buildEvents(d);renderProfile();renderTeach();
    const P=d.publikasi||[];
    $('count-pub').textContent=P.length;
    if(P.length){renderPubFilters();renderPubList()}else $('pub-content').innerHTML=empty('fa-book-open','Belum ada publikasi.');
    const S=[...(d.pengabdian||[])].sort((a,b)=>(parseInt(b.tahun)||0)-(parseInt(a.tahun)||0));
    $('count-srv').textContent=S.length;
    $('srv-content').innerHTML=S.length?S.map((s,n)=>`<div class="glass-card" style="--i:${Math.min(n,12)}"><div class="card-icon">${esc(s.tahun||'—')}</div><div class="card-info"><div class="item-title">${esc(s.judul)}</div><div class="item-meta"><span class="badge highlight">${esc(s.kategori||'—')}</span></div></div></div>`).join(''):empty('fa-handshake-angle','Belum ada data pengabdian.');
    placeInd();
  }catch(err){
    console.error('[loadData]',err);
    const box=`<div class="error-box"><i class="fa-solid fa-circle-exclamation"></i><h3>Gagal memuat data.json</h3><p>Pastikan <code>data.json</code> ada di folder yang sama dan halaman dibuka lewat <b>http://</b> (Live Server atau GitHub Pages), bukan <code>file://</code>.</p><button class="retry-btn" onclick="location.reload()"><i class="fa-solid fa-rotate-right"></i> Coba lagi</button></div>`;
    $('edu-content').innerHTML=`<div class="grid-list">${box}</div>`;
    ['teach-content','pub-content','srv-content'].forEach(i=>$(i).innerHTML='');
  }
}

/* ============ PERKULIAHAN (GITHUB) ============ */
const ghOwner='vickysegu',ghRepo='vickysegu.github.io',ghBase='Materi';
let ghPath=ghBase,ghFiles=[];
const FT={pdf:['fa-file-pdf','#ef4444'],ppt:['fa-file-powerpoint','#f97316'],pptx:['fa-file-powerpoint','#f97316'],doc:['fa-file-word','#3b82f6'],docx:['fa-file-word','#3b82f6'],xls:['fa-file-excel','#22c55e'],xlsx:['fa-file-excel','#22c55e'],csv:['fa-file-excel','#22c55e'],html:['fa-book-open-reader','#e34f26'],zip:['fa-file-zipper','#a78bfa'],rar:['fa-file-zipper','#a78bfa'],png:['fa-file-image','#f472b6'],jpg:['fa-file-image','#f472b6'],jpeg:['fa-file-image','#f472b6'],webp:['fa-file-image','#f472b6'],svg:['fa-file-image','#f472b6']};
async function ghFetch(path){
  const key='gh:'+path;
  try{const c=JSON.parse(sessionStorage.getItem(key)||'null');if(c&&Date.now()-c.t<6e5)return c.d}catch(e){}
  const res=await fetch(`https://api.github.com/repos/${ghOwner}/${ghRepo}/contents/${path}`);
  if(!res.ok){const er=new Error('HTTP '+res.status);er.status=res.status;throw er}
  const d=await res.json();
  try{sessionStorage.setItem(key,JSON.stringify({t:Date.now(),d}))}catch(e){}
  return d;
}
async function loadGitHubFiles(path=ghBase){
  ghPath=path;$('gh-q').value='';renderCrumb();
  $('github-content').innerHTML=skel(4);
  try{
    const f=await ghFetch(path);
    ghFiles=Array.isArray(f)?f.sort((a,b)=>a.type!==b.type?(a.type==='dir'?-1:1):a.name.localeCompare(b.name,'id',{numeric:true})):[];
    renderGh();
  }catch(err){
    console.error('[GitHub]',err);
    $('github-content').innerHTML=`<div class="error-box"><i class="fa-solid fa-triangle-exclamation"></i><h3>Gagal memuat folder</h3><p>${err.status===403?'Batas permintaan GitHub tercapai. Coba lagi beberapa menit lagi.':'Periksa koneksi internet, lalu coba lagi.'}</p><button class="retry-btn" data-path="${esc(path)}"><i class="fa-solid fa-rotate-right"></i> Coba lagi</button></div>`;
  }
}
function renderCrumb(){
  const parts=ghPath.split('/');
  $('gh-crumb').innerHTML=parts.map((p,i)=>`${i?'<i class="fa-solid fa-chevron-right"></i>':''}<button data-path="${esc(parts.slice(0,i+1).join('/'))}">${esc(p)}</button>`).join('');
}
function renderGh(){
  const q=$('gh-q').value.trim().toLowerCase();
  const L=ghFiles.filter(f=>!q||f.name.toLowerCase().includes(q));
  if(!L.length){$('github-content').innerHTML=empty('fa-folder-open',q?'Tidak ada yang cocok.':'Folder ini kosong.');return}
  $('github-content').innerHTML=L.map((f,n)=>{
    const nm=esc(f.name),st=`--i:${Math.min(n,12)}`;
    if(f.type==='dir')return `<div class="glass-card" style="${st};cursor:pointer" data-path="${esc(f.path)}"><div class="card-icon"><i class="fa-solid fa-folder" style="color:#facc15"></i></div><div class="card-info"><div class="item-title">${nm}</div><div class="item-meta"><span class="badge">Folder</span></div></div></div>`;
    const ext=(f.name.split('.').pop()||'').toLowerCase(),ft=FT[ext]||['fa-file-code','#60a5fa'];
    const url=`https://${ghOwner}.github.io/${f.path}`;
    return `<div class="glass-card" style="${st}"><div class="card-icon"><i class="fa-solid ${ft[0]}" style="color:${ft[1]}"></i></div><div class="card-info"><div class="item-title"><a href="${esc(url)}" target="_blank" rel="noopener">${nm} <i class="fa-solid fa-up-right-from-square" style="font-size:10px"></i></a></div><div class="item-meta"><span class="badge highlight">${ext==='html'?'Web Page':esc(ext||'File')}</span><button class="mini" data-link="${esc(url)}" aria-label="Salin tautan"><i class="fa-regular fa-copy"></i> Tautan</button></div></div></div>`;
  }).join('');
}
$('gh-q').addEventListener('input',renderGh);

if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInd);
window.addEventListener('load',()=>setTimeout(extractAccent,300));
loadData();
