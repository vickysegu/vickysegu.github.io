    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;

        /* Istilah teknis hanya dibedakan dengan warna teks bersih tanpa garis bawah atau ikon */
        .tech-term {
            color: #4f46e5;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.15s ease, opacity 0.15s ease;
        }
        .dark .tech-term {
            color: #818cf8;
        }
        .tech-term:hover {
            color: #3730a3;
            opacity: 0.85;
        }
        .dark .tech-term:hover {
            color: #a5b4fc;
        }

        /* Animasi perpindahan slide */
        .slide-enter {
            animation: fadeSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Efek indikator aktif pada simulasi */
        @keyframes softPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79, 70, 229, 0.3); }
            50% { box-shadow: 0 0 0 6px rgba(79, 70, 229, 0); }
        }
        .node-active {
            animation: softPulse 1.6s infinite;
            border-color: #4f46e5 !important;
        }
        .dark .node-active {
            border-color: #818cf8 !important;
        }

        @keyframes packetMove {
            0% { transform: translateX(-6px); opacity: 0.4; }
            50% { transform: translateX(6px); opacity: 1; }
            100% { transform: translateX(-6px); opacity: 0.4; }
        }
        .packet-anim {
            animation: packetMove 1.4s ease-in-out infinite;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }

        }

        function updateS6DraftPrice(val) {
            const parsed = parseInt(val, 10);
            if (!isNaN(parsed) && parsed >= 0) {
                s6DraftPrice = parsed;
            }
        }

        function applyS6PriceChange(sourceMode) {
            s6ProductName = (s6DraftName || '').trim() || 'Kopi Susu Gula Aren';
            s6ProductPrice = (!isNaN(s6DraftPrice) && s6DraftPrice >= 0) ? s6DraftPrice : 15000;
            if (sourceMode === 'uts') {
                s6PriceFeedback = 'Harga berhasil diubah menjadi Rp ' + s6ProductPrice.toLocaleString('id-ID') + ' dengan mengedit file kode secara manual. Bayangkan jika pemilik UMKM memiliki 100 produk dan tidak mengerti koding!';
            } else {
                s6PriceFeedback = 'Database MySQL berhasil diperbarui lewat Form Admin! Tanpa membongkar kode program, harga "' + s6ProductName + '" di katalog pembeli langsung berubah menjadi Rp ' + s6ProductPrice.toLocaleString('id-ID') + '.';
            }
            renderCurrentSlide();
        }

        function setArchTab(tab) {
            archTab = tab;
            renderCurrentSlide();
        }

        // Fungsi Interaksi Slide 8 (Laboratorium Trio Front-End)
        function toggleFeLayer(layer) {
            if (layer === 'html') feToggleHTML = !feToggleHTML;
            if (layer === 'css') feToggleCSS = !feToggleCSS;
            if (layer === 'js') {
                feToggleJS = !feToggleJS;
                feActionFeedback = feToggleJS
                    ? 'JavaScript AKTIF! Sekarang setiap perubahan ukuran, jumlah, kode promo UMKM20, maupun validasi nama langsung dihitung secara real-time.'
                    : 'JavaScript NONAKTIF. Tampilan kartu tetap rapi berkat CSS, tetapi seluruh perhitungan dan validasi kembali mati.';
            }
            renderCurrentSlide();
        }

        function interactFeSize(sizeChoice) {
            if (!feToggleJS) {
                feActionFeedback = 'Anda mengeklik tombol ukuran ' + (sizeChoice === 'large' ? 'Large (+Rp 10.000)' : 'Regular') + ', tetapi harga TIDAK BERGERAK! CSS hanya mempercantik tampilan tombol, ia tidak bisa menjumlahkan angka.';
                renderCurrentSlide();
                return;
            }
            feDemoSize = sizeChoice;
            feActionFeedback = 'JavaScript mendeteksi klik ukuran -> menambahkan biaya ukuran ke variabel hargaSatuan dan memperbarui teks DOM.';
            renderCurrentSlide();
        }

        function interactFeQty(delta) {
            if (!feToggleJS) {
                feActionFeedback = 'Anda mengeklik tombol ubah jumlah, tetapi angka tetap diam di 1! Tanpa JavaScript, tombol HTML hanyalah elemen pasif.';
                renderCurrentSlide();
                return;
            }
            feDemoQty = Math.max(1, feDemoQty + delta);
            feActionFeedback = 'JavaScript menjalankan fungsi hitungEstimasi() -> mengalikan harga satuan dengan jumlah pesanan (' + feDemoQty + ' pcs) secara instan.';
            renderCurrentSlide();
        }

        function interactFePromo(val) {
            feDemoPromo = val;
            if (!feToggleJS) {
                const banner = document.getElementById('feFeedbackBannerText');
                if (banner) {
                    banner.textContent = 'Anda mengetik kode "' + val + '", tetapi potongan diskon tidak dihitung karena JavaScript masih Nonaktif!';
                }
                return;
            }
            const isPromo = val.trim().toUpperCase() === 'UMKM20';
            feActionFeedback = isPromo
                ? 'Kode promo UMKM20 cocok! JavaScript otomatis memotong total harga sebesar 20%.'
                : 'JavaScript memeriksa setiap huruf yang Anda ketik. Ketik UMKM20 untuk mendapatkan diskon 20%.';
            renderCurrentSlide();
        }

        function interactFeCustomer(val) {
            feDemoCustomer = val;
            if (!feToggleJS) {
                const banner = document.getElementById('feFeedbackBannerText');
                if (banner) {
                    banner.textContent = 'Tanpa JavaScript, browser tidak bisa memberikan peringatan validasi otomatis saat kolom nama dikosongkan.';
                }
                return;
            }
            feActionFeedback = val.trim() === ''
                ? 'Validasi JavaScript bekerja: mendeteksi kolom nama kosong dan menampilkan peringatan merah!'
                : 'Validasi JavaScript: Nama pemesan terisi ("' + val + '").';
            renderCurrentSlide();
        }

        function setFeCodeTab(tab) {
            feActiveCodeTab = tab;
            renderCurrentSlide();
        }

        function setDevToolsViewport(vp) {
            devToolsViewport = vp;
            renderCurrentSlide();
        }

        function setDevToolsTab(tab) {
            devToolsTab = tab;
            renderCurrentSlide();
        }

        function setFolderMode(mode) {
            folderMode = mode;
            renderCurrentSlide();
        }

        function toggleReflectionAnswer(id) {
            openReflectionKey[id] = !openReflectionKey[id];
            renderCurrentSlide();
        }

        function showTerm(key) {
            const item = GLOSSARY_DB[key];
            if (!item) return;

            document.getElementById('termCategoryBadge').textContent = item.category;
            document.getElementById('termTitle').textContent = item.title;
            document.getElementById('termMainDesc').textContent = item.main;
            document.getElementById('termDetailDesc').textContent = item.detail;
            document.getElementById('termSourceName').textContent = "Sumber: " + item.source;
            document.getElementById('termSourceUrl').href = item.url;

            const modal = document.getElementById('termModalBackdrop');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeTermModal() {
            const modal = document.getElementById('termModalBackdrop');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function openGlossaryIndex() {
            document.getElementById('glossarySearchInput').value = '';
            renderGlossaryList('');
            const modal = document.getElementById('glossaryModalBackdrop');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeGlossaryIndex() {
            const modal = document.getElementById('glossaryModalBackdrop');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function selectGlossaryTerm(key) {
            closeGlossaryIndex();
            showTerm(key);
        }

        function renderGlossaryList(query) {
            const q = String(query || '').trim().toLowerCase();
            const allKeys = Object.keys(GLOSSARY_DB);
            const matchedKeys = [];

            for (let i = 0; i < allKeys.length; i++) {
                const k = allKeys[i];
                const item = GLOSSARY_DB[k];
                if (
                    item.title.toLowerCase().indexOf(q) !== -1 ||
                    item.category.toLowerCase().indexOf(q) !== -1 ||
                    item.main.toLowerCase().indexOf(q) !== -1
                ) {
                    matchedKeys.push(k);
                }
            }

            const container = document.getElementById('glossaryListGrid');
            if (matchedKeys.length === 0) {
                container.innerHTML = '<div class="col-span-2 text-center py-8 text-xs text-slate-500">Istilah tidak ditemukan.</div>';
                return;
            }

            let html = '';
            for (let i = 0; i < matchedKeys.length; i++) {
                const k = matchedKeys[i];
                const item = GLOSSARY_DB[k];
                html += `
                    <button type="button" onclick="selectGlossaryTerm('${k}')" class="text-left p-4 rounded-2xl bg-slate-50 hover:bg-indigo-50/60 dark:bg-slate-800/50 dark:hover:bg-slate-800 border border-slate-200/80 dark:border-slate-800 transition space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">${escapeHtml(item.category)}</span>
                            <span class="text-[10px] text-slate-400">${escapeHtml(item.source)}</span>
                        </div>
                        <div class="text-sm font-extrabold text-slate-900 dark:text-white">${escapeHtml(item.title)}</div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${escapeHtml(item.main)}</p>
                    </button>
                `;
            }

            container.innerHTML = html;
        }

        function toggleTheme() {
            const htmlEl = document.documentElement;
            const icon = document.getElementById('themeIcon');
            htmlEl.classList.toggle('dark');
            const isDark = htmlEl.classList.contains('dark');
            icon.className = isDark ? 'fa-solid fa-sun text-amber-400 text-sm' : 'fa-solid fa-moon text-sm';
        }

        document.addEventListener('keydown', function (e) {
            const activeTag = document.activeElement && document.activeElement.tagName
                ? document.activeElement.tagName.toLowerCase()
                : '';
            if (activeTag === 'input' || activeTag === 'textarea') return;

            if (e.key === 'ArrowRight') changeSlide(1);
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'Escape') {
                closeTermModal();
                closeGlossaryIndex();
            }
        });

        window.onload = function () {
            renderCurrentSlide();
        };
    </script>
</body>
</html>
