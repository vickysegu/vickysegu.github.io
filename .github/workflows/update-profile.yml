name: Update Profile & Data Dosen (Bulanan)

on:
  schedule:
    # Tanggal 1 tiap bulan, 03:00 UTC = 10:00 WIB
    - cron: '0 3 1 * *'
  workflow_dispatch:  # bisa trigger manual dari tab Actions

permissions:
  contents: write

# Cegah 2 run jalan bareng → hindari konflik push
concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pddiktipy

      - name: 🚀 Jalankan Skrip Update
        env:
          NAMA_DOSEN: "VICKY SETIA GUNAWAN"
          NAMA_PT:    "UNIVERSITAS PERINTIS INDONESIA"
          PRODI:      "BISNIS DIGITAL"
          SCHOLAR_ID: "zxh3WngAAAAJ"
          OUTPUT_FILE: "data.json"
        run: python update_profile.py
        continue-on-error: false

      - name: 💾 Commit & Push jika Ada Perubahan
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "✓ Tidak ada perubahan pada data.json"
          else
            git commit -m "chore: auto-update profile ($(date -u +%Y-%m)) [skip ci]"
            git push
            echo "✓ data.json berhasil diupdate"
          fi
