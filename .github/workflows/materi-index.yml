name: Update materi index

on:
  push:
    branches: [main, master]
    paths:
      - 'Materi/**'
      - '.github/scripts/build-materi-index.js'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/build-materi-index.js
      - name: Commit jika berubah
        run: |
          if [ -n "$(git status --porcelain materi-index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add materi-index.json
            git commit -m "chore: update materi-index.json"
            git push
          fi
